name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Hatch
        run: python -m pip install --disable-pip-version-check hatch
      - name: Run checks
        run: hatch run check
      - name: Build distributions
        run: hatch build
      - name: Smoke-test clean wheel installation
        run: hatch run smoke-wheel

  required:
    name: required
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Test matrix result: $MATRIX_RESULT"
            exit 1
          fi
