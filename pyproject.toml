[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chdmanpy"
version = "0.1.0"
description = "A pipeline-friendly command-line frontend for CHDMAN"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "bohemon" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
chdmanpy = "chdmanpy.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/bohemon/chdmanpy"
Documentation = "https://github.com/bohemon/chdmanpy/blob/main/docs/usage.md"
Issues = "https://github.com/bohemon/chdmanpy/issues"
Source = "https://github.com/bohemon/chdmanpy"

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
  "/.agents",
  "/.git",
  "/.github",
  "/.idea",
  "/.venv",
  "/.vscode",
  "/build",
  "/dist",
  "/input",
  "/output",
  "/test",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/__pycache__",
  "**/*.exe",
  "**/*.py[cod]",
  "**/chdman",
  "**/mame*.zip",
]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/README.ja.md",
  "/docs",
  "/install-chdman.ps1",
  "/pyproject.toml",
  "/src/chdmanpy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chdmanpy"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "chdmanpy/docs"
"README.md" = "chdmanpy/README.md"
"README.ja.md" = "chdmanpy/README.ja.md"

[tool.hatch.envs.default]
dependencies = [
  "pytest>=8.3,<10",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check {args:src tests}"
format = "ruff format --check {args:src tests}"
check = [
  "ruff check src tests",
  "ruff format --check src tests",
  "pytest tests",
]
smoke-wheel = "python tests/smoke_wheel.py {args:dist}"
test-real-chdman = "pytest -m real_chdman tests/test_real_chdman.py"

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "-m",
  "not real_chdman",
]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_chdman: optional integration tests that require an installed CHDMAN",
]
timeout = 30
timeout_method = "thread"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "SIM",
  "UP",
]

[tool.ruff.format]
line-ending = "lf"
